<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    header, footer {
      background-color: darkslategray;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    #todos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    @media (min-width: 768px) {
      #todos {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>My To-Do List</h1>
    <p id="count">0 of 0 completed</p>
  </header>

  <main>
    <p id="status">Loading...</p>
    <section id="todos"></section>
  </main>

  <footer>
    <p>My To-Do List Project</p>
  </footer>

  <script>
    async function loadTodos() {

      const status = document.getElementById("status");
      const list = document.getElementById("todos");

      status.textContent = "Loading...";

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/todos?_limit=12"
        );

        if (!response.ok) {
          throw new Error("Failed to load data");
        }

        const todos = await response.json();

        status.textContent = "";
        list.replaceChildren();

        todos.forEach(todo => {

          const card = document.createElement("div");
          card.className = "card";

          if (todo.completed) {
            card.textContent = "✅ " + todo.title;
          } else {
            card.textContent = "⬜ " + todo.title;
          }

          list.appendChild(card);
        });

        const completed = todos.filter(
          todo => todo.completed
        ).length;

        document.getElementById("count").textContent =
          completed + " of " + todos.length + " completed";

      } catch (error) {

        status.textContent =
          "Sorry, could not load the data. Please try again.";

      }
    }

    loadTodos();
  </script>

</body>
</html>
